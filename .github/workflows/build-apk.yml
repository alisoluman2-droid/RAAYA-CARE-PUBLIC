name: Build RAAYA CARE APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create Android app
        run: |
          mkdir -p app/src/main/java/com/raayacare/app
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'RaayaCare'; include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          echo "plugins { id 'com.android.application' }; android { namespace 'com.raayacare.app'; compileSdk 35; defaultConfig { applicationId 'com.raayacare.app'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' } }" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="RAAYA CARE" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/raayacare/app/MainActivity.java <<'EOF'
          package com.raayacare.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            WebView web;
            public void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              web.loadUrl("https://alisoluman2-droid.github.io/RAAYA-CARE-PUBLIC/");
            }
            @Override public void onBackPressed() {
              if(web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - name: Build APK
        run: gradle wrapper --gradle-version 8.9 && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RAAYA-CARE-APK
          path: app/build/outputs/apk/debug/*.apk
