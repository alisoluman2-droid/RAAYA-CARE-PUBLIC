name: Build RAAYA CARE APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/raayacare/app
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'RaayaCare'
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.raayacare.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.raayacare.app'
              minSdk 23
              targetSdk 35
              versionCode 5
              versionName '1.4'
            }
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:label="RAAYA CARE" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/raayacare/app/MainActivity.java <<'EOT'
          package com.raayacare.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.widget.Toast;
          public class MainActivity extends Activity {
            private WebView web;
            private static final String HOME = "https://frolicking-kleicha-e7c846.netlify.app/";
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              setContentView(web);
              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
              CookieManager.getInstance().setAcceptCookie(true);
              settings.setAllowFileAccess(false);
              settings.setAllowContentAccess(false);
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient() {
                @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                  if (request.isForMainFrame()) Toast.makeText(MainActivity.this,"تعذر فتح رايا كير. تحقق من الإنترنت.",Toast.LENGTH_LONG).show();
                }
              });
              web.loadUrl(HOME);
            }
            // Never replay WebView history: it can expose an earlier authenticated screen after logout.
            // In-app back buttons continue to work through the website's own navigation.
            @Override public void onBackPressed() { finish(); }
            @Override protected void onDestroy() {
              if (web != null) { web.destroy(); web = null; }
              super.onDestroy();
            }
          }
          EOT
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check APK contents
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -25
      - uses: actions/upload-artifact@v4
        with:
          name: RAAYA-CARE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
